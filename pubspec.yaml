name: kalino_app
description: "کالینو - پلتفرم نیازمندی‌ها و خرید و فروش آنلاین در افغانستان"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Localization & Languages
  easy_localization: ^3.0.7
  intl: ^0.19.0

  # Icons & Design UI
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.1
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  dot_navigation_bar: ^1.0.2
  like_button: ^2.0.5
  carousel_slider: ^5.0.0
  flutter_chat_bubble: ^2.0.2
  custom_pop_up_menu: ^1.2.4

  # Firebase Services
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.3.0
  firebase_storage: ^12.2.0
  firebase_app_check: ^0.3.0+8
  firebase_performance: ^0.10.0+8

  # State Management & Local Storage
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2

  # OTP & Inputs Validation
  otp_text_field: ^1.1.3
  email_validator: ^2.1.17

  # Media & Network Images
  image_picker: ^1.1.2
  cached_network_image: ^3.4.0

  # Location & Maps
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  google_maps_flutter: ^2.9.0
  map_launcher: ^3.2.0

  # System Utilities & Permissions
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0

flutter:
  uses-material-design: true

  # Assets Path
  assets:
    - assets/
    - assets/lottie/
    - assets/lang/

  # Custom Fonts
  fonts:
    - family: iranyekan
      fonts:
        - asset: assets/fonts/iranyekanRegular.ttf
        - asset: assets/fonts/iranyekanBold.ttf
          weight: 700
