name: kalino_app
description: "Kalino E-commerce Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.20.3
  easy_localization: ^3.0.7

  flutter_localizations:
    sdk: flutter

  firebase_core: ^3.3.0
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.1.0
  firebase_database: ^11.0.3
  firebase_storage: ^12.1.2
  google_sign_in: ^6.2.1

  permission_handler: ^11.3.1
  http: ^1.2.2
  provider: ^6.1.2
  restart_app: ^1.2.1
  url_launcher: ^6.3.0
  country_picker: ^2.0.24
  rounded_loading_button_plus: ^3.0.1
  cupertino_icons: ^1.0.6
  pinput: ^5.0.1
  loading_animation_widget: ^1.2.1

  share_plus: ^10.1.2
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  connectivity_plus: ^6.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

dependency_overrides:
  vector_math: 2.1.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lang/
    - assets/fonts/

  fonts:
    - family: IranYekan
      fonts:
        - asset: assets/fonts/iranyekanwebregular.ttf
          weight: 400
        - asset: assets/fonts/iranyekanwebbold.ttf
          weight: 700
