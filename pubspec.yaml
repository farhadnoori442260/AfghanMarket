name: kalino_app
description: "Kalino E-commerce Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Localization & Utilities
  easy_localization: ^3.0.7
  flutter_localizations:
    sdk: flutter
  permission_handler: ^11.3.1
  http: ^1.2.2
  provider: ^6.1.2
  restart_app: ^1.2.1
  url_launcher: ^6.3.0
  country_picker: ^2.0.24
  rounded_loading_button_plus: ^3.0.1
  cupertino_icons: ^1.0.6
  pinput: ^5.0.1
  loading_animation_widget: ^1.2.1
  share_plus: ^10.1.2
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  connectivity_plus: ^6.0.4
  email_validator: ^3.0.0
  flutter_secure_storage: ^9.2.2
  otp_text_field: ^1.1.0

  # Firebase Ecosystem
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.1.0
  firebase_database: ^11.0.3
  firebase_storage: ^12.1.2
  firebase_app_check: ^0.3.1+2
  google_sign_in: ^6.2.1

  # Maps & Location
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  map_launcher: ^3.3.0

  # UI Components & Media
  cached_network_image: ^3.4.1
  lottie: ^3.1.3
  carousel_slider: ^5.0.0
  dot_navigation_bar: ^1.0.2
  csc_picker: ^0.2.7
  galleryimage: ^1.0.0
  custom_pop_up_menu: ^1.2.4
  flutter_chat_bubble: ^2.0.2
  search_page: ^2.3.0

  # Fix AGP 8 Lifecycle / Namespace compatibility
  flutter_plugin_android_lifecycle: ^2.0.22

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  vector_math: 2.1.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lang/
    - assets/fonts/

  fonts:
    - family: IranYekan
      fonts:
        - asset: assets/fonts/iranyekanwebregular.ttf
          weight: 400
        - asset: assets/fonts/iranyekanwebbold.ttf
          weight: 700
