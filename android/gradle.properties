# Gradle JVM memory allocation (Increased for faster build and memory safety)
org.gradle.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=512m

# Enable AndroidX support
android.useAndroidX=true

# Disable Jetifier to speed up builds (All modern Flutter packages support AndroidX natively)
android.enableJetifier=false

# Enable parallel builds & build caching for faster build times
org.gradle.parallel=true
org.gradle.caching=true

# Keystore configuration placeholders
RELEASE_STORE_FILE=RELEASE_STORE_FILE
RELEASE_STORE_PASSWORD=RELEASE_STORE_PASSWORD
RELEASE_KEY_ALIAS=RELEASE_KEY_ALIAS
RELEASE_KEY_PASSWORD=RELEASE_KEY_PASSWORD
