workflows:
  android-workflow:
    name: Kalino Android Build
    max_build_duration: 60
    instance_type: linux_x2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'master'
          include: true
          source: true

    environment:
      groups:
        - kalino_env # یا safir_new
      flutter: 3.29.3
      java: 21

    scripts:
      - name: Show versions
        script: |
          flutter --version
          dart --version

      - name: Set up Firebase Config (google-services.json)
        script: |
          if [ -n "$ANDROID_FIREBASE_JSON" ]; then
            echo $ANDROID_FIREBASE_JSON | base64 --decode > android/app/google-services.json
            echo "google-services.json successfully created."
          else
            echo "ANDROID_FIREBASE_JSON variable not found, using repository file."
          fi

      - name: Clean Flutter cache
        script: |
          flutter clean

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Set permissions for Gradle Wrapper
        script: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
            echo "Gradlew permissions set."
          else
            echo "android/gradlew not found, skipping permission change..."
          fi

      - name: Set up Keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > /tmp/release.jks

      - name: Get SHA-1
        script: |
          keytool -list -v -keystore /tmp/release.jks -alias $CM_KEY_ALIAS -storepass $CM_KEYSTORE_PASSWORD

      - name: Build Release APK
        script: |
          cat <<EOF > android/key.properties
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=/tmp/release.jks
          EOF
          flutter build apk --release --split-per-abi

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
