workflows:
  android-workflow:
    name: Kalino Android ARM64 Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true

    environment:
      groups:
        - kalino_env
      flutter: stable
      java: 17

    scripts:
      - name: Show versions
        script: |
          flutter --version
          dart --version
          java -version

      - name: Set up Firebase Config
        script: |
          if [ -n "$ANDROID_FIREBASE_JSON" ]; then
            echo "$ANDROID_FIREBASE_JSON" | base64 --decode > android/app/google-services.json
            echo "google-services.json created from environment variable."
          else
            echo "ANDROID_FIREBASE_JSON not found; using repository file."
          fi

      - name: Clean Flutter cache
        script: |
          flutter clean

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Set Gradle permission
        script: |
          chmod +x android/gradlew

      - name: Set up Keystore
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > /tmp/release.jks

      - name: Show signing SHA-1
        script: |
          keytool -list -v \
            -keystore /tmp/release.jks \
            -alias "$CM_KEY_ALIAS" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            | grep "SHA1"

      - name: Create signing properties
        script: |
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=/tmp/release.jks
          EOF

      - name: Build small ARM64 Release APK
        script: |
          flutter build apk --release --target-platform android-arm64

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/mapping/release/mapping.txt
